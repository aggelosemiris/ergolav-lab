ue,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"ins-wet-room.steps.3":{"section":"steps","n":"Περνάμε το πρώτο χέρι στεγανωτικού στο δάπεδο και στους τοίχους· στη ζώνη του ντους μέχρι το ύψος που συμφωνήσαμε.","s":"Περνάμε το πρώτο χέρι στο πάτωμα και στους τοίχους· στο ντους ανεβαίνουμε όσο ψηλά έχουμε πει.","c":"Πρώτο χέρι ως το συμφωνημένο ύψος.","source":"current","review":{"key":"sc:ins-wet-room.steps.3","hash":"947faa0c4c63","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"ins-wet-room.steps.4":{"section":"steps","n":"Μετά το στέγνωμα περνάμε δεύτερο χέρι σταυρωτά, για ομοιόμορφο πάχος χωρίς κενά.","s":"Όταν στεγνώσει, περνάμε δεύτερο χέρι στην αντίθετη κατεύθυνση, για να μη μείνουν κενά.","c":"Δεύτερο χέρι σταυρωτά.","source":"current","review":{"key":"sc:ins-wet-room.steps.4","hash":"3095cdb91b11","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"wp.checks.membrane-joints":{"section":"checks","n":"Ελέγχουμε όλες τις ενώσεις των φύλλων: είναι κολλημένες σε όλο το μήκος, χωρίς φουσκώματα.","s":"Κοιτάμε όλες τις ενώσεις: είναι κολλημένες από άκρη σε άκρη και δεν έχουν φουσκώσει.","c":"Ενώσεις κολλημένες, χωρίς φουσκώματα.","source":"new","review":{"key":"sc:wp.checks.membrane-joints","hash":"baff255967fb","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"wp.prerequisites.slope":{"section":"prerequisites","n":"Το σιφώνι ή το κανάλι δαπέδου στη θέση του και κλίση στο δάπεδο της ντουζιέρας προς αυτό.","s":"Το σιφόνι ή το κανάλι του πατώματος να έχει μπει και το πάτωμα της ντουζιέρας να γέρνει προς τα εκεί.","c":"Σιφώνι στη θέση και κλίση προς αυτό.","source":"new","review":{"key":"sc:wp.prerequisites.slope","hash":"852b4ffb1ac3","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"wp.steps.drain-flange":{"section":"steps","n":"Ενώνουμε τη στεγάνωση με τη φλάντζα του σιφωνιού δαπέδου, ώστε όποιο νερό περάσει κάτω από το πλακάκι να φεύγει στο σιφώνι.","s":"Ενώνουμε τη στεγάνωση με το στεφάνι του σιφωνιού, για να πηγαίνει στο σιφόνι και το νερό που περνάει κάτω από τα πλακάκια.","c":"Σύνδεση στεγάνωσης με τη φλάντζα σιφωνιού.","source":"new","review":{"key":"sc:wp.steps.drain-flange","hash":"7e5b128a33e7","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"wp.steps.membrane-lay":{"section":"steps","n":"Κολλάμε τα φύλλα της μεμβράνης στο δάπεδο και στους τοίχους με την κόλλα που ορίζει ο κατασκευαστής· στη ζώνη του ντους μέχρι το ύψος που συμφωνήσαμε.","s":"Κολλάμε τα φύλλα της στεγάνωσης στο πάτωμα και στους τοίχους με την κόλλα τους· στο ντους ανεβαίνουμε όσο ψηλά έχουμε πει.","c":"Κόλληση φύλλων μεμβράνης ως το συμφωνημένο ύψος.","source":"new","review":{"key":"sc:wp.steps.membrane-lay","hash":"af2d1b8b4183","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"wp.steps.membrane-overlap":{"section":"steps","n":"Κάθε φύλλο πατά στο διπλανό με επικάλυψη και οι ενώσεις κολλιούνται με την ειδική κόλλα ή ταινία.","s":"Κάθε φύλλο μπαίνει λίγο πάνω στο διπλανό του και οι ενώσεις κολλιούνται με ειδική κόλλα ή ταινία.","c":"Ενώσεις με επικάλυψη και κόλλα.","source":"new","review":{"key":"sc:wp.steps.membrane-overlap","hash":"2fffaffe60b1","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"wp.x.gutters":{"section":"preparation","n":"Καθαρίζουμε τις υδρορροές σε όλο το μήκος τους, ώστε να φεύγει ελεύθερα το νερό.","s":"Καθαρίζουμε τους σωλήνες της βροχής ως κάτω, για να φεύγουν ελεύθερα τα νερά.","c":"Καθάρισμα υδρορροών.","source":"new","review":{"key":"sc:wp.x.gutters","hash":"90a35298e5bc","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"wp.x.niche":{"section":"steps","n":"Στεγανώνουμε και τις κόγχες ή τα ράφια μέσα στη ζώνη του ντους, με ταινία στις γωνίες τους.","s":"Στεγανώνουμε και τις εσοχές ή τα ραφάκια μέσα στο ντους, με ταινία στις γωνίες τους.","c":"Στεγάνωση κογχών στη ζώνη ντους.","source":"new","review":{"key":"sc:wp.x.niche","hash":"34bde62a8486","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"wp.x.outside-zone":{"section":"steps","n":"Στεγανώνουμε και μια λωρίδα δαπέδου έξω από τη ζώνη του ντους, εκεί που πέφτουν νερά.","s":"Στεγανώνουμε και λίγο πάτωμα έξω από το ντους, εκεί που πέφτουν νερά όταν βγαίνετε.","c":"Λωρίδα έξω από τη ζώνη ντους.","source":"new","review":{"key":"sc:wp.x.outside-zone","hash":"6dadf87d1312","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"wp.x.threshold":{"section":"steps","n":"Στεγανώνουμε προσεκτικά κάτω από το κατωκάσι της μπαλκονόπορτας, όπου η ταράτσα ή το μπαλκόνι φτάνει σε πόρτα.","s":"Αν υπάρχει μπαλκονόπορτα, στεγανώνουμε προσεκτικά και το σημείο κάτω από το πάτωμα της πόρτας.","c":"Στεγάνωση κάτω από κατωκάσι.","source":"new","review":{"key":"sc:wp.x.threshold","hash":"2cd775e53048","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}}},"licensedNote":"Η εργασία αυτή γίνεται, όπως ορίζει ο νόμος, από αδειούχο ή πιστοποιημένο επαγγελματία.","sections":[{"key":"prerequisites","title":"Τι χρειάζεται πριν ξεκινήσουμε"},{"key":"preparation","title":"Προεργασία"},{"key":"steps","title":"Στάδια τοποθέτησης"},{"key":"checks","title":"Έλεγχοι πριν την παράδοση"},{"key":"handover","title":"Καθαρισμός και παράδοση"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'ergolav-review:' + D.material;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S = {reviewer: '', decisions: {}};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} paint(); };
$('reviewer').value = S.reviewer || '';
$('reviewer').oninput = e => { S.reviewer = e.target.value; save(); };
// Αποφάσεις: μόνο για το κείμενο που φαίνεται (ίδιο αποτύπωμα)· ό,τι άλλαξε από τότε ξαναζητά έλεγχο.
const keys = {};
for(const c of D.cases) if(c.review) keys[c.review.key] = c.review;
for(const [, it] of Object.entries(D.items)) keys[it.review.key] = it.review;
for(const x of D.extras) keys[x.review.key] = x.review;
const verdict = k => { const d = S.decisions[k]; return d && d.hash === keys[k].hash ? d.verdict : (keys[k].reviewed ? 'ok' : null); };
const decideHtml = (k, what) => {
  const d = S.decisions[k] && S.decisions[k].hash === keys[k].hash ? S.decisions[k] : null, v = verdict(k);
  return '<div class="decide" data-key="' + esc(k) + '"><span class="what">' + what + '</span>'
    + '<button type="button" class="ok' + (v === 'ok' ? ' on' : '') + '" data-v="ok" aria-pressed="' + (v === 'ok') + '">Εγκρίνω</button>'
    + '<button type="button" class="fix' + (v === 'fix' ? ' on' : '') + '" data-v="fix" aria-pressed="' + (v === 'fix') + '">Θέλει διόρθωση</button>'
    + '<textarea placeholder="Τι να διορθωθεί;" aria-label="Σχόλιο"' + (v === 'fix' ? '' : ' hidden') + '>' + esc(d && d.comment || '') + '</textarea></div>';
};
const item = (id, withSc) => {
  const it = D.items[id];
  return '<div class="row" data-item="' + esc(id) + '">'
    + '<div class="v"><small>Κανονική <span class="tag ' + (it.source === 'new' ? 'new">νέο' : 'cur">σημερινό') + '</span></small>' + esc(it.n) + '</div>'
    + '<div class="v"><small>Απλή</small>' + esc(it.s) + '</div>'
    + '<div class="v"><small>Σύντομη</small>' + esc(it.c) + '</div>'
    + (withSc ? '<div class="acts">' + decideHtml(it.review.key, 'Απλή και σύντομη:') + '</div>' : '') + '</div>';
};
const body = c => {
  let h = '<p class="meta">Περίπτωση: ' + esc(c.label) + ' · ' + esc(c.duration) + (c.task ? ' · κείμενο: ' + esc(c.task) : '') + '</p>';
  if(c.licensed) h += '<p class="note">' + esc(D.licensedNote) + '</p>';
  if(c.safety) h += '<p class="note">Ασφάλεια: ' + esc(c.safety) + '</p>';
  for(const s of D.sections){ const ids = c.sections[s.key] || []; if(!ids.length) continue;
    h += '<div class="sec"><h3>' + esc(s.title) + '</h3>' + ids.map(id => item(id, true)).join('') + '</div>'; }
  if(c.review) h += decideHtml(c.review.key, c.source === 'existing' ? 'Η περίπτωση (έτοιμο κείμενο):' : 'Η περίπτωση (σύνθεση και νέα κείμενα):');
  return h;
};
const groups = [['base', 'Βασικές περιπτώσεις (σημερινές αναλύσεις)', 'Τα κείμενα δεν αλλάζουν· ελέγχεις μόνο την απλή και τη σύντομη εκδοχή.'],
  ['existing', 'Περιπτώσεις με έτοιμο κείμενο', 'Από τις 96 γραμμένες αναλύσεις.'], ['new', D.material === 'generic' ? 'Κατηγορίες' : 'Νέες περιπτώσεις', '']];
let html = '';
for(const [src, title, sub] of groups){
  const list = D.cases.filter(c => c.source === src); if(!list.length) continue;
  html += '<h2>' + title + ' (' + list.length + ')</h2>' + (sub ? '<p class="small meta">' + sub + '</p>' : '');
  for(const c of list) html += '<details class="case" data-case="' + esc(c.id) + '"><summary><b>' + esc(c.title) + '</b><span class="state" data-state="' + esc(c.id) + '"></span><span class="lbl">' + esc(c.label) + '</span></summary><div class="body"></div></details>';
}
if(D.extras.length){
  html += '<h2>Επιπλέον βήματα για το «Λείπει κάτι» (' + D.extras.length + ')</h2>';
  html += '<div class="case" style="padding:0 14px 14px">' + D.extras.map(x => '<div class="sec"><h3>' + esc((D.sections.find(s => s.key === x.section) || {}).title || x.section)
    + (x.when ? ' · <span class="meta">μόνο όταν ' + esc(Object.entries(x.when).map(([k, v]) => k + ' = ' + v.join(' ή ')).join(', ')) + '</span>' : '') + '</h3>'
    + item(x.id, true) + decideHtml(x.review.key, 'Να μπαίνει ως επιπλέον βήμα:') + '</div>').join('') + '</div>';
}
$('cases').innerHTML = html;
// Το σώμα κάθε περίπτωσης φτιάχνεται όταν ανοίξει (οι σελίδες έχουν εκατοντάδες σημεία).
document.querySelectorAll('details.case').forEach(d => d.addEventListener('toggle', () => {
  const b = d.querySelector('.body'); if(d.open && !b.innerHTML) b.innerHTML = body(D.cases.find(c => c.id === d.dataset.case));
}));
document.addEventListener('click', e => {
  const btn = e.target.closest('.decide button'); if(!btn) return;
  const k = btn.closest('.decide').dataset.key, v = btn.dataset.v, prev = S.decisions[k];
  S.decisions[k] = {verdict: v, hash: keys[k].hash, comment: v === 'fix' ? (prev && prev.comment || '') : ''};
  save();
});
document.addEventListener('input', e => {
  const box = e.target.closest('.decide'); if(!box || e.target.tagName !== 'TEXTAREA') return;
  const k = box.dataset.key; S.decisions[k] = Object.assign({verdict: 'fix', hash: keys[k].hash}, S.decisions[k], {comment: e.target.value});
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
});
function paint(){
  // Ίδιο σημείο σε πολλές περιπτώσεις: η απόφαση φαίνεται παντού.
  document.querySelectorAll('.decide').forEach(box => {
    const v = verdict(box.dataset.key);
    box.querySelectorAll('button').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    box.querySelector('textarea').hidden = v !== 'fix';
  });
  for(const c of D.cases){
    const el = document.querySelector('[data-state="' + CSS.escape(c.id) + '"]'); if(!el) continue;
    const ks = [...(c.review ? [c.review.key] : []), ...Object.values(c.sections).flat().map(id => D.items[id].review.key)];
    const vs = ks.map(verdict), fix = vs.includes('fix'), done = vs.every(v => v === 'ok');
    el.className = 'state ' + (fix ? 'fix' : done ? 'ok' : 'todo');
    el.textContent = fix ? 'θέλει διόρθωση' : done ? 'εγκρίθηκε' : vs.filter(Boolean).length + '/' + vs.length;
  }
  const all = Object.keys(keys), dec = all.filter(k => verdict(k));
  $('progress').textContent = dec.length + ' από ' + all.length + ' αποφάσεις · ' + all.filter(k => verdict(k) === 'fix').length + ' για διόρθωση';
}
document.addEventListener('toggle', paint, true);
$('filter').onchange = e => {
  const f = e.target.value;
  document.querySelectorAll('details.case').forEach(d => {
    const st = d.querySelector('.state').className;
    d.classList.toggle('hidden', f === 'todo' ? /\b(ok)\b/.test(st) : f === 'fix' ? !/\bfix\b/.test(st) : false);
  });
};
$('export').onclick = () => {
  if(!S.reviewer.trim()){ $('reviewer').focus(); alert('Γράψε πρώτα το όνομά σου (ποιος ελέγχει).'); return; }
  const decisions = Object.entries(S.decisions).filter(([k, d]) => keys[k] && d.hash === keys[k].hash).map(([key, d]) => ({key, hash: d.hash, verdict: d.verdict, comment: d.comment || ''}));
  const file = {format: 'ergolav-reviews', version: 1, material: D.material, reviewer: S.reviewer.trim(), exported_at: new Date().toISOString(), decisions};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(file, null, 1)], {type: 'application/json'}));
  a.download = 'ergolav-elegxos-' + D.material + '-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
};
$('approveSc').onclick = () => {
  // Γρήγορα: όσες απλές/σύντομες δεν έχουν απόφαση, στις ανοιχτές περιπτώσεις.
  document.querySelectorAll('details.case[open] .row .decide').forEach(box => { const k = box.dataset.key; if(!verdict(k)) S.decisions[k] = {verdict: 'ok', hash: keys[k].hash, comment: ''}; });
  save();
};
paint();
</script>
</body></html>
