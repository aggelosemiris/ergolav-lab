review":{"key":"sc:plumb-wc-floor.checks.2","hash":"8f22c66b08cf","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.checks.3":{"section":"checks","n":"Το καζανάκι σταματά να γεμίζει στη σωστή στάθμη και δεν τρέχει νερό στη λεκάνη μετά το γέμισμα.","s":"Το καζανάκι σταματά να γεμίζει όπου πρέπει και δεν τρέχει νερό στη λεκάνη μετά.","c":"Σωστή στάθμη, χωρίς νερό να τρέχει.","source":"current","review":{"key":"sc:plumb-wc-floor.checks.3","hash":"22db527151f7","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.checks.4":{"section":"checks","n":"Καθόμαστε στη λεκάνη: δεν κουνιέται και δεν τρίζει.","s":"Καθόμαστε πάνω: η λεκάνη μένει σταθερή και δεν κάνει θόρυβο.","c":"Δεν κουνιέται, δεν τρίζει.","source":"current","review":{"key":"sc:plumb-wc-floor.checks.4","hash":"405d7a4dd1f0","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.handover.1":{"section":"handover","n":"Σφραγίζουμε με σιλικόνη τη βάση της λεκάνης στο δάπεδο.","s":"Βάζουμε σιλικόνη γύρω από τη βάση της λεκάνης στο πάτωμα.","c":"Σιλικόνη στη βάση.","source":"current","review":{"key":"sc:plumb-wc-floor.handover.1","hash":"8c93a1dff659","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.handover.2":{"section":"handover","n":"Παίρνουμε την παλιά λεκάνη, αν το έχουμε συμφωνήσει, και καθαρίζουμε τον χώρο.","s":"Παίρνουμε την παλιά λεκάνη, αν το συμφωνήσαμε, και καθαρίζουμε.","c":"Παλιά λεκάνη και καθάρισμα.","source":"current","review":{"key":"sc:plumb-wc-floor.handover.2","hash":"86f73b001a99","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.preparation.1":{"section":"preparation","n":"Κλείνουμε το νερό, αδειάζουμε το καζανάκι και αφαιρούμε την παλιά λεκάνη.","s":"Κλείνουμε το νερό, αδειάζουμε το καζανάκι και βγάζουμε την παλιά λεκάνη.","c":"Αφαιρούμε την παλιά λεκάνη.","source":"current","review":{"key":"sc:plumb-wc-floor.preparation.1","hash":"be8d9c864dc9","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.preparation.2":{"section":"preparation","n":"Ταπώνουμε προσωρινά την αποχέτευση, για να μη βγαίνουν οσμές.","s":"Κλείνουμε προσωρινά την τρύπα της αποχέτευσης, για να μη μυρίζει.","c":"Ταπώνουμε την αποχέτευση.","source":"current","review":{"key":"sc:plumb-wc-floor.preparation.2","hash":"97113902b6e4","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.preparation.3":{"section":"preparation","n":"Καθαρίζουμε το δάπεδο από παλιά σιλικόνη ή τσιμέντο και ελέγχουμε ότι το στόμιο της αποχέτευσης είναι γερό.","s":"Καθαρίζουμε το πάτωμα από παλιά σιλικόνη ή τσιμέντο και κοιτάμε ότι η τρύπα της αποχέτευσης είναι γερή.","c":"Καθαρίζουμε το δάπεδο, ελέγχουμε το στόμιο.","source":"current","review":{"key":"sc:plumb-wc-floor.preparation.3","hash":"3a34e086d9e7","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.prerequisites.1":{"section":"prerequisites","n":"Να έχει επιλεγεί λεκάνη με έξοδο που ταιριάζει στην αποχέτευση του μπάνιου (στο δάπεδο ή στον τοίχο).","s":"Η λεκάνη πρέπει να έχει την έξοδο νερών στο ίδιο σημείο με την αποχέτευση του μπάνιου, στο πάτωμα ή στον τοίχο.","c":"Έξοδος λεκάνης που ταιριάζει στην αποχέτευση.","source":"current","review":{"key":"sc:plumb-wc-floor.prerequisites.1","hash":"da92b1af873c","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.prerequisites.2":{"section":"prerequisites","n":"Παροχή νερού για το καζανάκι, με γωνιακό διακόπτη κοντά στη θέση της λεκάνης.","s":"Να υπάρχει σωλήνας νερού για το καζανάκι, με διακόπτη κοντά στη λεκάνη.","c":"Παροχή με γωνιακό κοντά στη λεκάνη.","source":"current","review":{"key":"sc:plumb-wc-floor.prerequisites.2","hash":"f97ce178b031","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.steps.1":{"section":"steps","n":"Τοποθετούμε τον σύνδεσμο ή τη φλάντζα της αποχέτευσης, ώστε να ταιριάζει με την έξοδο της λεκάνης.","s":"Βάζουμε το κομμάτι που ενώνει τη λεκάνη με την αποχέτευση, ώστε να ταιριάζει ακριβώς.","c":"Σύνδεσμος αποχέτευσης στην έξοδο.","source":"current","review":{"key":"sc:plumb-wc-floor.steps.1","hash":"6e0ddf35082f","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.steps.2":{"section":"steps","n":"Βάζουμε τη λεκάνη στη θέση της, σημαδεύουμε και ανοίγουμε τις τρύπες στερέωσης στο δάπεδο.","s":"Βάζουμε τη λεκάνη στη θέση της και σημαδεύουμε και ανοίγουμε τις τρύπες για τις βίδες στο πάτωμα.","c":"Σημαδεύουμε και τρυπάμε για στερέωση.","source":"current","review":{"key":"sc:plumb-wc-floor.steps.2","hash":"98de7797e219","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.steps.3":{"section":"steps","n":"Στερεώνουμε τη λεκάνη με τις βίδες της, αλφαδιασμένη.","s":"Βιδώνουμε τη λεκάνη στο πάτωμα, απόλυτα ίσια.","c":"Στερεώνουμε τη λεκάνη, αλφαδιασμένη.","source":"current","review":{"key":"sc:plumb-wc-floor.steps.3","hash":"7d95b7af82d4","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.steps.4":{"section":"steps","n":"Τοποθετούμε το καζανάκι, αν είναι χωριστό κομμάτι, και συνδέουμε την παροχή νερού με σπιράλ στον γωνιακό διακόπτη.","s":"Βάζουμε το καζανάκι, αν είναι χωριστό κομμάτι, και του φέρνουμε νερό με εύκαμπτο σωληνάκι από τον διακόπτη.","c":"Καζανάκι και σπιράλ στον γωνιακό.","source":"current","review":{"key":"sc:plumb-wc-floor.steps.4","hash":"3af7061d0122","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-floor.steps.5":{"section":"steps","n":"Τοποθετούμε το κάθισμα.","s":"Βάζουμε το κάθισμα.","c":"Τοποθέτηση καθίσματος.","source":"current","review":{"key":"sc:plumb-wc-floor.steps.5","hash":"b8470b868f44","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-wall-hung.checks.1":{"section":"checks","n":"Γεμίζουμε το καζανάκι και τραβάμε αρκετές φορές: η λεκάνη ξεπλένεται σε όλη την περιφέρεια και αδειάζει κανονικά.","s":"Γεμίζουμε το καζανάκι και τραβάμε πολλές φορές: το νερό καθαρίζει όλη τη λεκάνη και φεύγει κανονικά.","c":"Τραβάμε πολλές φορές: ξεπλένει παντού.","source":"current","revi hung.handover.2","hash":"e72dfa746d1c","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-wall-hung.handover.3":{"section":"handover","n":"Σας δείχνουμε πώς βγαίνει η πλάκα χειρισμού και πού είναι ο διακόπτης του καζανακιού, για μελλοντικό έλεγχο.","s":"Σας δείχνουμε πώς βγαίνει το κουμπί και πού είναι ο διακόπτης του καζανακιού, για να το βρείτε αν χρειαστεί.","c":"Σας δείχνουμε κουμπί και διακόπτη καζανακιού.","source":"current","review":{"key":"sc:plumb-wc-wall-hung.handover.3","hash":"bdf63b302991","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-wall-hung.preparation.1":{"section":"preparation","n":"Προστατεύουμε δάπεδο και είδη υγιεινής με χαρτόνι ή νάιλον.","s":"Σκεπάζουμε το πάτωμα και τα είδη του μπάνιου με χαρτόνι ή νάιλον.","c":"Προστασία δαπέδου και ειδών υγιεινής.","source":"current","review":{"key":"sc:plumb-wc-wall-hung.preparation.1","hash":"3b57c65ae92d","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-wall-hung.preparation.2":{"section":"preparation","n":"Κλείνουμε το νερό, αφαιρούμε την παλιά λεκάνη και το καζανάκι και ταπώνουμε προσωρινά την αποχέτευση, για να μη βγαίνουν οσμές.","s":"Κλείνουμε το νερό, βγάζουμε την παλιά λεκάνη και το καζανάκι και κλείνουμε προσωρινά την τρύπα της αποχέτευσης, για να μη μυρίζει.","c":"Αφαιρούμε λεκάνη και καζανάκι, ταπώνουμε την αποχέτευση.","source":"current","review":{"key":"sc:plumb-wc-wall-hung.preparation.2","hash":"f454f11c6ab2","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-wall-hung.preparation.3":{"section":"preparation","n":"Ανοίγουμε στον τοίχο τη φωλιά, δηλαδή την εσοχή όπου μπαίνει το πλαίσιο.","s":"Σκάβουμε στον τοίχο μια εσοχή, εκεί που θα μπει η μεταλλική βάση του καζανακιού.","c":"Ανοίγουμε τη φωλιά για το πλαίσιο.","source":"current","review":{"key":"sc:plumb-wc-wall-hung.preparation.3","hash":"ac87ed26c1ce","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-wall-hung.preparation.4":{"section":"preparation","n":"Ελέγχουμε ότι η παροχή νερού και η αποχέτευση είναι στο σωστό ύψος και, αν χρειάζεται, τις μετακινούμε.","s":"Κοιτάμε ότι ο σωλήνας του νερού και η αποχέτευση είναι στο σωστό ύψος· αν όχι, τους μετακινούμε.","c":"Ελέγχουμε ύψος νερού και αποχέτευσης.","source":"current","review":{"key":"sc:plumb-wc-wall-hung.preparation.4","hash":"8c79c8dfc2e5","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-wall-hung.prerequisites.1":{"section":"prerequisites","n":"Να έχουν επιλεγεί η λεκάνη και το σύστημα εντοιχισμού, ώστε να ταιριάζουν οι αποστάσεις στήριξης και αποχέτευσης.","s":"Να έχουμε διαλέξει τη λεκάνη και το καζανάκι του τοίχου, που πρέπει να ταιριάζουν μεταξύ τους.","c":"Λεκάνη και σύστημα εντοιχισμού συμβατά.","source":"current","review":{"key":"sc:plumb-wc-wall-hung.prerequisites.1","hash":"719462827fef","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-wall-hung.prerequisites.2":{"section":"prerequisites","n":"Ο τοίχος να αντέχει το σύστημα· αν είναι ελαφρύς (π.χ. γυψοσανίδα), το πλαίσιο στηρίζεται και στο δάπεδο. Το ελέγχουμε στην επίσκεψη.","s":"Ο τοίχος πρέπει να αντέχει το βάρος· αν είναι ελαφρύς, όπως η γυψοσανίδα, η βάση πατά και στο πάτωμα. Το κοιτάμε όταν έρθουμε.","c":"Τοίχος που αντέχει· σε ελαφρύ, στήριξη και στο δάπεδο.","source":"current","review":{"key":"sc:plumb-wc-wall-hung.prerequisites.2","hash":"d8b07d333af9","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-wall-hung.prerequisites.3":{"section":"prerequisites","n":"Συνεννόηση με τον πλακά, γιατί η λεκάνη κρεμιέται αφού μπουν τα πλακάκια.","s":"Συνεννοούμαστε με τον πλακά, γιατί η λεκάνη κρεμιέται αφού μπουν τα πλακάκια.","c":"Σειρά με τον πλακά: η λεκάνη μετά τα πλακάκια.","source":"current","review":{"key":"sc:plumb-wc-wall-hung.prerequisites.3","hash":"025c0a1e574b","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-wall-hung.steps.1":{"section":"steps","n":"Στερεώνουμε το μεταλλικό πλαίσιο στον τοίχο και στο δάπεδο, αλφαδιασμένο οριζόντια και κάθετα wall-hung.steps.6":{"section":"steps","n":"Μετά το πλακάκι, κρεμάμε τη λεκάνη στις ντίζες του πλαισίου με τα ελαστικά παρεμβύσματά της.","s":"Αφού μπουν τα πλακάκια, κρεμάμε τη λεκάνη στις βίδες της βάσης με τα λαστιχάκια της.","c":"Μετά το πλακάκι, κρεμάμε τη λεκάνη.","source":"current","review":{"key":"sc:plumb-wc-wall-hung.steps.6","hash":"6a216e6a7b30","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-wc-wall-hung.steps.7":{"section":"steps","n":"Τοποθετούμε την πλάκα χειρισμού (το κουμπί) και το κάθισμα.","s":"Βάζουμε το κουμπί του καζανακιού και το κάθισμα.","c":"Κουμπί και κάθισμα.","source":"current","review":{"key":"sc:plumb-wc-wall-hung.steps.7","hash":"dca42dc72db0","reviewed":false,"reviewer":null,"reviewed_at":null}},"wc.checks.inwall-floor-joint":{"section":"checks","n":"Ελέγχουμε με στεγνό χαρτί ότι δεν στάζει στη σύνδεση της λεκάνης με τον τοίχο και με την αποχέτευση.","s":"Περνάμε στεγνό χαρτί από τις ενώσεις της λεκάνης με τον τοίχο και την αποχέτευση: πρέπει να μείνει στεγνό.","c":"Στεγνό χαρτί στις ενώσεις: καμία σταγόνα.","source":"new","review":{"key":"sc:wc.checks.inwall-floor-joint","hash":"9af9591b9c8d","reviewed":false,"reviewer":null,"reviewed_at":null}},"wc.preparation.cap-drain":{"section":"preparation","n":"Ταπώνουμε προσωρινά την αποχέτευση, για να μη βγαίνουν οσμές και να μην πέσουν μπάζα μέσα.","s":"Κλείνουμε προσωρινά την τρύπα της αποχέτευσης, για να μη μυρίζει και να μη βουλώσει από μπάζα.","c":"Ταπώνουμε προσωρινά την αποχέτευση.","source":"new","review":{"key":"sc:wc.preparation.cap-drain","hash":"c08a0f9a3844","reviewed":false,"reviewer":null,"reviewed_at":null}},"wc.preparation.check-outlet":{"section":"preparation","n":"Ελέγχουμε ότι το στόμιο της αποχέτευσης είναι στη θέση και στο ύψος που θέλει η νέα λεκάνη, πριν μπουν τα πλακάκια.","s":"Κοιτάμε, πριν τα πλακάκια, ότι η τρύπα της αποχέτευσης είναι ακριβώς εκεί που τη θέλει η λεκάνη.","c":"Ελέγχουμε θέση και ύψος του στομίου πριν τα πλακάκια.","source":"new","revi απέδου.","s":"Βάζουμε το καζανάκι μέσα στον τοίχο, στο ύψος που χρειάζεται η λεκάνη του πατώματος.","c":"Καζανάκι εντοιχισμού στο ύψος για λεκάνη δαπέδου.","source":"new","review":{"key":"sc:wc.steps.inwall-cistern","hash":"b9d73df5d27b","reviewed":false,"reviewer":null,"reviewed_at":null}},"wc.steps.inwall-flush-pipe":{"section":"steps","n":"Ενώνουμε τη λεκάνη με το καζανάκι με τον σωλήνα έκπλυσης που βγαίνει από τον τοίχο.","s":"Ενώνουμε τη λεκάνη με το καζανάκι του τοίχου με τον σωλήνα που φέρνει το νερό του καζανακιού.","c":"Σωλήνας έκπλυσης από τον τοίχο στη λεκάνη.","source":"new","review":{"key":"sc:wc.steps.inwall-flush-pipe","hash":"4a2700991dc7","reviewed":false,"reviewer":null,"reviewed_at":null}},"wc.steps.outlet-floor":{"section":"steps","n":"Τοποθετούμε τη φλάντζα ή τον σύνδεσμο στο στόμιο του δαπέδου, ώστε να πέσει ακριβώς κάτω από την έξοδο της λεκάνης.","s":"Βάζουμε το κομμάτι που ενώνει τη λεκάνη με την τρύπα του πατώματος, ακριβώς από κάτω της.","c":"Φλάντζα ή σύνδεσμος στο στόμιο του δαπέδου.","source":"new","review":{"key":"sc:wc.steps.outlet-floor","hash":"cfda38c75be5","reviewed":false,"reviewer":null,"reviewed_at":null}},"wc.steps.outlet-wall":{"section":"steps","n":"Τοποθετούμε τον σύνδεσμο στο στόμιο του τοίχου, στο ύψος και στην απόσταση της εξόδου της λεκάνης.","s":"Βάζουμε το κομμάτι που ενώνει τη λεκάνη με την τρύπα του τοίχου, ακριβώς στο ύψος της.","c":"Σύνδεσμος στο στόμιο του τοίχου, στο ύψος της εξόδου.","source":"new","review":{"key":"sc:wc.steps.outlet-wall","hash":"d5a000a16eab","reviewed":false,"reviewer":null,"reviewed_at":null}},"wc.x.angle-valve":{"section":"preparation","n":"Αλλάζουμε τον γωνιακό διακόπτη του καζανακιού, αν είναι παλιός και δεν κλείνει καλά.","s":"Αν ο μικρός διακόπτης του καζανακιού είναι παλιός και δεν κλείνει, τον αλλάζουμε.","c":"Αλλαγή παλιού γωνιακού διακόπτη.","source":"new","review":{"key":"sc:wc.x.angle-valve","hash":"33138ae96d7e","reviewed":false,"reviewer":null,"reviewed_at":null}},"wc.x.colour-test":{"section":"checks","n":"Ρίχνουμε χρωματιστό νερό στο καζανάκι και ελέγχουμε ότι δεν περνά στη λεκάνη χωρίς να τραβήξουμε.","s":"Βάζουμε λίγο χρώμα στο νερό του καζανακιού: αν δεν φανεί στη λεκάνη, το καζανάκι δεν χάνει νερό.","c":"Δοκιμή με χρωματιστό νερό για διαρροή.","source":"new","review":{"key":"sc:wc.x.colour-test","hash":"42b63a4e1d29","reviewed":false,"reviewer":null,"reviewed_at":null}},"wc.x.level-floor":{"section":"preparation","n":"Διορθώνουμε την ανωμαλία του δαπέδου στη θέση της λεκάνης, ώστε να πατά σταθερά.","s":"Ισιώνουμε το πάτωμα εκεί που πατά η λεκάνη, για να μην κουνιέται.","c":"Ισιώνουμε το δάπεδο στη βάση.","source":"new","review":{"key":"sc:wc.x.level-floor","hash":"4e1a64fc995c","reviewed":false,"reviewer":null,"reviewed_at":null}},"wc.x.take-old":{"section":"handover","n":"Παίρνουμε την παλιά λεκάνη και το καζανάκι, αν το έχουμε συμφωνήσει.","s":"Παίρνουμε μαζί μας την παλιά λεκάνη και το καζανάκι, αν το θέλετε.","c":"Παίρνουμε τα παλιά, αν συμφωνήθηκε.","source":"new","review":{"key":"sc:wc.x.take-old","hash":"4e12538bdd2c","reviewed":false,"reviewer":null,"reviewed_at":null}}},"licensedNote":"Η εργασία αυτή γίνεται, όπως ορίζει ο νόμος, από αδειούχο ή πιστοποιημένο επαγγελματία.","sections":[{"key":"prerequisites","title":"Τι χρειάζεται πριν ξεκινήσουμε"},{"key":"preparation","title":"Προεργασία"},{"key":"steps","title":"Στάδια τοποθέτησης"},{"key":"checks","title":"Έλεγχοι πριν την παράδοση"},{"key":"handover","title":"Καθαρισμός και παράδοση"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'ergolav-review:' + D.material;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S = {reviewer: '', decisions: {}};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} paint(); };
$('reviewer').value = S.reviewer || '';
$('reviewer').oninput = e => { S.reviewer = e.target.value; save(); };
// Αποφάσεις: μόνο για το κείμενο που φαίνεται (ίδιο αποτύπωμα)· ό,τι άλλαξε από τότε ξαναζητά έλεγχο.
const keys = {};
for(const c of D.cases) if(c.review) keys[c.review.key] = c.review;
for(const [, it] of Object.entries(D.items)) keys[it.review.key] = it.review;
for(const x of D.extras) keys[x.review.key] = x.review;
const verdict = k => { const d = S.decisions[k]; return d && d.hash === keys[k].hash ? d.verdict : (keys[k].reviewed ? 'ok' : null); };
const decideHtml = (k, what) => {
  const d = S.decisions[k] && S.decisions[k].hash === keys[k].hash ? S.decisions[k] : null, v = verdict(k);
  return '<div class="decide" data-key="' + esc(k) + '"><span class="what">' + what + '</span>'
    + '<button type="button" class="ok' + (v === 'ok' ? ' on' : '') + '" data-v="ok" aria-pressed="' + (v === 'ok') + '">Εγκρίνω</button>'
    + '<button type="button" class="fix' + (v === 'fix' ? ' on' : '') + '" data-v="fix" aria-pressed="' + (v === 'fix') + '">Θέλει διόρθωση</button>'
    + '<textarea placeholder="Τι να διορθωθεί;" aria-label="Σχόλιο"' + (v === 'fix' ? '' : ' hidden') + '>' + esc(d && d.comment || '') + '</textarea></div>';
};
const item = (id, withSc) => {
  const it = D.items[id];
  return '<div class="row" data-item="' + esc(id) + '">'
    + '<div class="v"><small>Κανονική <span class="tag ' + (it.source === 'new' ? 'new">νέο' : 'cur">σημερινό') + '</span></small>' + esc(it.n) + '</div>'
    + '<div class="v"><small>Απλή</small>' + esc(it.s) + '</div>'
    + '<div class="v"><small>Σύντομη</small>' + esc(it.c) + '</div>'
    + (withSc ? '<div class="acts">' + decideHtml(it.review.key, 'Απλή και σύντομη:') + '</div>' : '') + '</div>';
};
const body = c => {
  let h = '<p class="meta">Περίπτωση: ' + esc(c.label) + ' · ' + esc(c.duration) + (c.task ? ' · κείμενο: ' + esc(c.task) : '') + '</p>';
  if(c.licensed) h += '<p class="note">' + esc(D.licensedNote) + '</p>';
  if(c.safety) h += '<p class="note">Ασφάλεια: ' + esc(c.safety) + '</p>';
  for(const s of D.sections){ const ids = c.sections[s.key] || []; if(!ids.length) continue;
    h += '<div class="sec"><h3>' + esc(s.title) + '</h3>' + ids.map(id => item(id, true)).join('') + '</div>'; }
  if(c.review) h += decideHtml(c.review.key, c.source === 'existing' ? 'Η περίπτωση (έτοιμο κείμενο):' : 'Η περίπτωση (σύνθεση και νέα κείμενα):');
  return h;
};
const groups = [['base', 'Βασικές περιπτώσεις (σημερινές αναλύσεις)', 'Τα κείμενα δεν αλλάζουν· ελέγχεις μόνο την απλή και τη σύντομη εκδοχή.'],
  ['existing', 'Περιπτώσεις με έτοιμο κείμενο', 'Από τις 96 γραμμένες αναλύσεις.'], ['new', D.material === 'generic' ? 'Κατηγορίες' : 'Νέες περιπτώσεις', '']];
let html = '';
for(const [src, title, sub] of groups){
  const list = D.cases.filter(c => c.source === src); if(!list.length) continue;
  html += '<h2>' + title + ' (' + list.length + ')</h2>' + (sub ? '<p class="small meta">' + sub + '</p>' : '');
  for(const c of list) html += '<details class="case" data-case="' + esc(c.id) + '"><summary><b>' + esc(c.title) + '</b><span class="state" data-state="' + esc(c.id) + '"></span><span class="lbl">' + esc(c.label) + '</span></summary><div class="body"></div></details>';
}
if(D.extras.length){
  html += '<h2>Επιπλέον βήματα για το «Λείπει κάτι» (' + D.extras.length + ')</h2>';
  html += '<div class="case" style="padding:0 14px 14px">' + D.extras.map(x => '<div class="sec"><h3>' + esc((D.sections.find(s => s.key === x.section) || {}).title || x.section)
    + (x.when ? ' · <span class="meta">μόνο όταν ' + esc(Object.entries(x.when).map(([k, v]) => k + ' = ' + v.join(' ή ')).join(', ')) + '</span>' : '') + '</h3>'
    + item(x.id, true) + decideHtml(x.review.key, 'Να μπαίνει ως επιπλέον βήμα:') + '</div>').join('') + '</div>';
}
$('cases').innerHTML = html;
// Το σώμα κάθε περίπτωσης φτιάχνεται όταν ανοίξει (οι σελίδες έχουν εκατοντάδες σημεία).
document.querySelectorAll('details.case').forEach(d => d.addEventListener('toggle', () => {
  const b = d.querySelector('.body'); if(d.open && !b.innerHTML) b.innerHTML = body(D.cases.find(c => c.id === d.dataset.case));
}));
document.addEventListener('click', e => {
  const btn = e.target.closest('.decide button'); if(!btn) return;
  const k = btn.closest('.decide').dataset.key, v = btn.dataset.v, prev = S.decisions[k];
  S.decisions[k] = {verdict: v, hash: keys[k].hash, comment: v === 'fix' ? (prev && prev.comment || '') : ''};
  save();
});
document.addEventListener('input', e => {
  const box = e.target.closest('.decide'); if(!box || e.target.tagName !== 'TEXTAREA') return;
  const k = box.dataset.key; S.decisions[k] = Object.assign({verdict: 'fix', hash: keys[k].hash}, S.decisions[k], {comment: e.target.value});
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
});
function paint(){
  // Ίδιο σημείο σε πολλές περιπτώσεις: η απόφαση φαίνεται παντού.
  document.querySelectorAll('.decide').forEach(box => {
    const v = verdict(box.dataset.key);
    box.querySelectorAll('button').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    box.querySelector('textarea').hidden = v !== 'fix';
  });
  for(const c of D.cases){
    const el = document.querySelector('[data-state="' + CSS.escape(c.id) + '"]'); if(!el) continue;
    const ks = [...(c.review ? [c.review.key] : []), ...Object.values(c.sections).flat().map(id => D.items[id].review.key)];
    const vs = ks.map(verdict), fix = vs.includes('fix'), done = vs.every(v => v === 'ok');
    el.className = 'state ' + (fix ? 'fix' : done ? 'ok' : 'todo');
    el.textContent = fix ? 'θέλει διόρθωση' : done ? 'εγκρίθηκε' : vs.filter(Boolean).length + '/' + vs.length;
  }
  const all = Object.keys(keys), dec = all.filter(k => verdict(k));
  $('progress').textContent = dec.length + ' από ' + all.length + ' αποφάσεις · ' + all.filter(k => verdict(k) === 'fix').length + ' για διόρθωση';
}
document.addEventListener('toggle', paint, true);
$('filter').onchange = e => {
  const f = e.target.value;
  document.querySelectorAll('details.case').forEach(d => {
    const st = d.querySelector('.state').className;
    d.classList.toggle('hidden', f === 'todo' ? /\b(ok)\b/.test(st) : f === 'fix' ? !/\bfix\b/.test(st) : false);
  });
};
$('export').onclick = () => {
  if(!S.reviewer.trim()){ $('reviewer').focus(); alert('Γράψε πρώτα το όνομά σου (ποιος ελέγχει).'); return; }
  const decisions = Object.entries(S.decisions).filter(([k, d]) => keys[k] && d.hash === keys[k].hash).map(([key, d]) => ({key, hash: d.hash, verdict: d.verdict, comment: d.comment || ''}));
  const file = {format: 'ergolav-reviews', version: 1, material: D.material, reviewer: S.reviewer.trim(), exported_at: new Date().toISOString(), decisions};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(file, null, 1)], {type: 'application/json'}));
  a.download = 'ergolav-elegxos-' + D.material + '-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
};
$('approveSc').onclick = () => {
  // Γρήγορα: όσες απλές/σύντομες δεν έχουν απόφαση, στις ανοιχτές περιπτώσεις.
  document.querySelectorAll('details.case[open] .row .decide').forEach(box => { const k = box.dataset.key; if(!verdict(k)) S.decisions[k] = {verdict: 'ok', hash: keys[k].hash, comment: ''}; });
  save();
};
paint();
</script>
</body></html>
