":"Σύνδεση αντλίας στην παροχή.","source":"new","review":{"key":"sc:bath.steps.whirl-connect","hash":"18091c6fdb6a","reviewed":false,"reviewer":null,"reviewed_at":null}},"bath.x.grab-bar":{"section":"steps","n":"Τοποθετούμε λαβή στήριξης στον τοίχο δίπλα στη μπανιέρα, όπου έχει συμφωνηθεί.","s":"Αν το έχουμε πει, βάζουμε χερούλι στον τοίχο για να πιάνεστε όταν μπαίνετε και βγαίνετε.","c":"Λαβή στήριξης, αν συμφωνήθηκε.","source":"new","review":{"key":"sc:bath.x.grab-bar","hash":"92c12d6c0549","reviewed":false,"reviewer":null,"reviewed_at":null}},"bath.x.screen":{"section":"steps","n":"Τοποθετούμε σταθερό ή ανοιγόμενο τζάμι πάνω στο χείλος της μπανιέρας, όπου έχει συμφωνηθεί.","s":"Αν το έχουμε πει, βάζουμε τζάμι πάνω στη μπανιέρα, για να μη βγαίνουν νερά στο ντους.","c":"Τζάμι μπανιέρας, αν συμφωνήθηκε.","source":"new","review":{"key":"sc:bath.x.screen","hash":"84d11312e00e","reviewed":false,"reviewer":null,"reviewed_at":null}},"bath.x.sound":{"section":"steps","n":"Γεμίζουμε τον χώρο κάτω από τη μπανιέρα με ηχομονωτικό υλικό, ώστε να κάνει λιγότερο θόρυβο.","s":"Βάζουμε από κάτω υλικό που κόβει τον θόρυβο, για να μην ακούγεται τόσο το νερό.","c":"Ηχομόνωση κάτω από τη μπανιέρα.","source":"new","review":{"key":"sc:bath.x.sound","hash":"c31fda5c4cf5","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.checks.1":{"section":"checks","n":"Γεμίζουμε τη μπανιέρα ως την υπερχείλιση και την αδειάζουμε: το σιφώνι δεν στάζει πουθενά.","s":"Γεμίζουμε ως πάνω και αδειάζουμε: από κάτω δεν στάζει τίποτα.","c":"Γέμισμα ως την υπερχείλιση, χωρίς στάξιμο.","source":"current","review":{"key":"sc:plumb-bathtub.checks.1","hash":"842bdad91f5b","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.checks.2":{"section":"checks","n":"Ελέγχουμε ότι αδειάζει χωρίς να μένει νερό στον πάτο.","s":"Κοιτάμε ότι αδειάζει όλη και δεν μένουν νερά στον πάτο.","c":"Αδειάζει πλήρως.","source":"current","review":{"key":"sc:plumb-bathtub.checks.2","hash":"41567e3bee16","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.checks.3":{"section":"checks","n":"Μπαίνουμε στη μπανιέρα: δεν κουνιέται και δεν τρίζει.","s":"Μπαίνουμε μέσα: η μπανιέρα δεν κουνιέται και δεν κάνει θόρυβο.","c":"Σταθερή, χωρίς τρίξιμο.","source":"current","review":{"key":"sc:plumb-bathtub.checks.3","hash":"2a6454e70331","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.handover.1":{"section":"handover","n":"Σφραγίζουμε με σιλικόνη την επαφή με τους τοίχους, με τη μπανιέρα γεμάτη νερό, ώστε να μην ανοίξει αργότερα η σιλικόνη.","s":"Βάζουμε σιλικόνη εκεί που ακουμπάει στους τοίχους, με τη μπανιέρα γεμάτη, για να μην ανοίξει μετά.","c":"Σιλικόνη με γεμάτη μπανιέρα.","source":"current","review":{"key":"sc:plumb-bathtub.handover.1","hash":"578030f1cca7","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.handover.2":{"section":"handover","n":"Καθαρίζουμε τον χώρο και σας λέμε πότε μπορεί να χρησιμοποιηθεί.","s":"Καθαρίζουμε και σας λέμε από πότε μπορείτε να τη χρησιμοποιήσετε.","c":"Καθάρισμα, πότε μπαίνει σε χρήση.","source":"current","review":{"key":"sc:plumb-bathtub.handover.2","hash":"fe42605781f6","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.preparation.1":{"section":"preparation","n":"Αφαιρούμε την παλιά μπανιέρα, αν υπάρχει, και καθαρίζουμε τη θέση.","s":"Βγάζουμε την παλιά μπανιέρα, αν υπάρχει, και καθαρίζουμε το σημείο.","c":"Αφαίρεση παλιάς, καθαρισμός.","source":"current","review":{"key":"sc:plumb-bathtub.preparation.1","hash":"d581fa78d92c","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.preparation.2":{"section":"preparation","n":"Ελέγχουμε την αποχέτευση και τις παροχές και, αν χρειάζεται, τις μετακινούμε.","s":"Κοιτάμε τους σωλήνες του νερού και της αποχέτευσης και, αν πρέπει, τους μετακινούμε.","c":"Έλεγχος και μετακίνηση παροχών.","source":"current","review":{"key":"sc:plumb-bathtub.preparation.2","hash":"2488a730970d","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.prerequisites.1":{"section":"prerequisites","n":"Να έχει επιλεγεί η μπανιέρα (διάσταση, πλευρά σιφωνιού) σε σχέση με τον χώρο.","s":"Να έχουμε διαλέξει τη μπανιέρα με το σωστό μέγεθος και το σιφόνι στη σωστή πλευρά για τον χώρο.","c":"Επιλεγμένη μπανιέρα για τον χώρο.","source":"current","review":{"key":"sc:plumb-bathtub.prerequisites.1","hash":"7804499648e1","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.prerequisites.2":{"section":"prerequisites","n":"Αποχέτευση στη θέση του σιφωνιού και παροχές νερού για τη μπαταρία.","s":"Να φτάνουν ως τη μπανιέρα η αποχέτευση και οι σωλήνες του νερού για τη βρύση.","c":"Αποχέτευση και παροχές στη θέση.","source":"current","review":{"key":"sc:plumb-bathtub.prerequisites.2","hash":"013a50f38dec","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.prerequisites.3":{"section":"prerequisites","n":"Δάπεδο σταθερό, που αντέχει το βάρος της γεμάτης μπανιέρας.","s":"Το πάτωμα να είναι γερό και να σηκώνει τη μπανιέρα γεμάτη νερό.","c":"Δάπεδο που αντέχει το βάρος.","source":"current","review":{"key":"sc:plumb-bathtub.prerequisites.3","hash":"5f67aeb3e32c","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.steps.1":{"section":"steps","n":"Συναρμολογούμε τα πόδια ή τον σκελετό στήριξης της μπανιέρας.","s":"Στήνουμε τα πόδια ή τη βάση που θα κρατάει τη μπανιέρα.","c":"Πόδια ή σκελετός στήριξης.","source":"current","review":{"key":"sc:plumb-bathtub.steps.1","hash":"ffeda4e9d2c9","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.steps.2":{"section":"steps","n":"Τοποθετούμε τη βαλβίδα και το σιφώνι μαζί με την υπερχείλιση, την τρύπα που δεν αφήνει το νερό να ξεχειλίσει.","s":"Βάζουμε την τάπα, το σιφόνι και το σωληνάκι που δεν αφήνει το νερό να ξεχειλίσει.","c":"Βαλβίδα, σιφώνι, υπερχείλιση.","source":"current","review":{"key":"sc:plumb-bathtub.steps.2","hash":"115bc155dd16","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.steps.3":{"section":"steps","n":"Βάζουμε τη μπανιέρα στη θέση της, την αλφαδιάζουμε και τη στερεώνουμε στον τοίχο με τα στηρίγματά της.","s":"Βάζουμε τη μπανιέρα στη θέση της, την ισιώνουμε και τη στερεώνουμε στον τοίχο.","c":"Τοποθέτηση, αλφάδι, στερέωση.","source":"current","review":{"key":"sc:plumb-bathtub.steps.3","hash":"2675af86c5d6","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.steps.4":{"section":"steps","n":"Συνδέουμε το σιφώνι στην αποχέτευση.","s":"Ενώνουμε το σιφόνι με τον σωλήνα της αποχέτευσης.","c":"Σιφώνι στην αποχέτευση.","source":"current","review":{"key":"sc:plumb-bathtub.steps.4","hash":"130149956250","reviewed":false,"reviewer":null,"reviewed_at":null}},"plumb-bathtub.steps.5":{"section":"steps","n":"Κλείνουμε το μπροστινό μέρος με την ποδιά της μπανιέρας ή με κατασκευή για πλακάκι, αφήνοντας θυρίδα επίσκεψης.","s":"Κλείνουμε μπροστά με το καπάκι της μπανιέρας ή με κατασκευή για πλακάκι, αφήνοντας ένα πορτάκι για να φτάνουμε το σιφόνι.","c":"Ποδιά με θυρίδα επίσκεψης.","source":"current","review":{"key":"sc:plumb-bathtub.steps.5","hash":"e4527e4f6c5f","reviewed":false,"reviewer":null,"reviewed_at":null}}},"licensedNote":"Η εργασία αυτή γίνεται, όπως ορίζει ο νόμος, από αδειούχο ή πιστοποιημένο επαγγελματία.","sections":[{"key":"prerequisites","title":"Τι χρειάζεται πριν ξεκινήσουμε"},{"key":"preparation","title":"Προεργασία"},{"key":"steps","title":"Στάδια τοποθέτησης"},{"key":"checks","title":"Έλεγχοι πριν την παράδοση"},{"key":"handover","title":"Καθαρισμός και παράδοση"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'ergolav-review:' + D.material;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S = {reviewer: '', decisions: {}};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} paint(); };
$('reviewer').value = S.reviewer || '';
$('reviewer').oninput = e => { S.reviewer = e.target.value; save(); };
// Αποφάσεις: μόνο για το κείμενο που φαίνεται (ίδιο αποτύπωμα)· ό,τι άλλαξε από τότε ξαναζητά έλεγχο.
const keys = {};
for(const c of D.cases) if(c.review) keys[c.review.key] = c.review;
for(const [, it] of Object.entries(D.items)) keys[it.review.key] = it.review;
for(const x of D.extras) keys[x.review.key] = x.review;
const verdict = k => { const d = S.decisions[k]; return d && d.hash === keys[k].hash ? d.verdict : (keys[k].reviewed ? 'ok' : null); };
const decideHtml = (k, what) => {
  const d = S.decisions[k] && S.decisions[k].hash === keys[k].hash ? S.decisions[k] : null, v = verdict(k);
  return '<div class="decide" data-key="' + esc(k) + '"><span class="what">' + what + '</span>'
    + '<button type="button" class="ok' + (v === 'ok' ? ' on' : '') + '" data-v="ok" aria-pressed="' + (v === 'ok') + '">Εγκρίνω</button>'
    + '<button type="button" class="fix' + (v === 'fix' ? ' on' : '') + '" data-v="fix" aria-pressed="' + (v === 'fix') + '">Θέλει διόρθωση</button>'
    + '<textarea placeholder="Τι να διορθωθεί;" aria-label="Σχόλιο"' + (v === 'fix' ? '' : ' hidden') + '>' + esc(d && d.comment || '') + '</textarea></div>';
};
const item = (id, withSc) => {
  const it = D.items[id];
  return '<div class="row" data-item="' + esc(id) + '">'
    + '<div class="v"><small>Κανονική <span class="tag ' + (it.source === 'new' ? 'new">νέο' : 'cur">σημερινό') + '</span></small>' + esc(it.n) + '</div>'
    + '<div class="v"><small>Απλή</small>' + esc(it.s) + '</div>'
    + '<div class="v"><small>Σύντομη</small>' + esc(it.c) + '</div>'
    + (withSc ? '<div class="acts">' + decideHtml(it.review.key, 'Απλή και σύντομη:') + '</div>' : '') + '</div>';
};
const body = c => {
  let h = '<p class="meta">Περίπτωση: ' + esc(c.label) + ' · ' + esc(c.duration) + (c.task ? ' · κείμενο: ' + esc(c.task) : '') + '</p>';
  if(c.licensed) h += '<p class="note">' + esc(D.licensedNote) + '</p>';
  if(c.safety) h += '<p class="note">Ασφάλεια: ' + esc(c.safety) + '</p>';
  for(const s of D.sections){ const ids = c.sections[s.key] || []; if(!ids.length) continue;
    h += '<div class="sec"><h3>' + esc(s.title) + '</h3>' + ids.map(id => item(id, true)).join('') + '</div>'; }
  if(c.review) h += decideHtml(c.review.key, c.source === 'existing' ? 'Η περίπτωση (έτοιμο κείμενο):' : 'Η περίπτωση (σύνθεση και νέα κείμενα):');
  return h;
};
const groups = [['base', 'Βασικές περιπτώσεις (σημερινές αναλύσεις)', 'Τα κείμενα δεν αλλάζουν· ελέγχεις μόνο την απλή και τη σύντομη εκδοχή.'],
  ['existing', 'Περιπτώσεις με έτοιμο κείμενο', 'Από τις 96 γραμμένες αναλύσεις.'], ['new', D.material === 'generic' ? 'Κατηγορίες' : 'Νέες περιπτώσεις', '']];
let html = '';
for(const [src, title, sub] of groups){
  const list = D.cases.filter(c => c.source === src); if(!list.length) continue;
  html += '<h2>' + title + ' (' + list.length + ')</h2>' + (sub ? '<p class="small meta">' + sub + '</p>' : '');
  for(const c of list) html += '<details class="case" data-case="' + esc(c.id) + '"><summary><b>' + esc(c.title) + '</b><span class="state" data-state="' + esc(c.id) + '"></span><span class="lbl">' + esc(c.label) + '</span></summary><div class="body"></div></details>';
}
if(D.extras.length){
  html += '<h2>Επιπλέον βήματα για το «Λείπει κάτι» (' + D.extras.length + ')</h2>';
  html += '<div class="case" style="padding:0 14px 14px">' + D.extras.map(x => '<div class="sec"><h3>' + esc((D.sections.find(s => s.key === x.section) || {}).title || x.section)
    + (x.when ? ' · <span class="meta">μόνο όταν ' + esc(Object.entries(x.when).map(([k, v]) => k + ' = ' + v.join(' ή ')).join(', ')) + '</span>' : '') + '</h3>'
    + item(x.id, true) + decideHtml(x.review.key, 'Να μπαίνει ως επιπλέον βήμα:') + '</div>').join('') + '</div>';
}
$('cases').innerHTML = html;
// Το σώμα κάθε περίπτωσης φτιάχνεται όταν ανοίξει (οι σελίδες έχουν εκατοντάδες σημεία).
document.querySelectorAll('details.case').forEach(d => d.addEventListener('toggle', () => {
  const b = d.querySelector('.body'); if(d.open && !b.innerHTML) b.innerHTML = body(D.cases.find(c => c.id === d.dataset.case));
}));
document.addEventListener('click', e => {
  const btn = e.target.closest('.decide button'); if(!btn) return;
  const k = btn.closest('.decide').dataset.key, v = btn.dataset.v, prev = S.decisions[k];
  S.decisions[k] = {verdict: v, hash: keys[k].hash, comment: v === 'fix' ? (prev && prev.comment || '') : ''};
  save();
});
document.addEventListener('input', e => {
  const box = e.target.closest('.decide'); if(!box || e.target.tagName !== 'TEXTAREA') return;
  const k = box.dataset.key; S.decisions[k] = Object.assign({verdict: 'fix', hash: keys[k].hash}, S.decisions[k], {comment: e.target.value});
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
});
function paint(){
  // Ίδιο σημείο σε πολλές περιπτώσεις: η απόφαση φαίνεται παντού.
  document.querySelectorAll('.decide').forEach(box => {
    const v = verdict(box.dataset.key);
    box.querySelectorAll('button').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    box.querySelector('textarea').hidden = v !== 'fix';
  });
  for(const c of D.cases){
    const el = document.querySelector('[data-state="' + CSS.escape(c.id) + '"]'); if(!el) continue;
    const ks = [...(c.review ? [c.review.key] : []), ...Object.values(c.sections).flat().map(id => D.items[id].review.key)];
    const vs = ks.map(verdict), fix = vs.includes('fix'), done = vs.every(v => v === 'ok');
    el.className = 'state ' + (fix ? 'fix' : done ? 'ok' : 'todo');
    el.textContent = fix ? 'θέλει διόρθωση' : done ? 'εγκρίθηκε' : vs.filter(Boolean).length + '/' + vs.length;
  }
  const all = Object.keys(keys), dec = all.filter(k => verdict(k));
  $('progress').textContent = dec.length + ' από ' + all.length + ' αποφάσεις · ' + all.filter(k => verdict(k) === 'fix').length + ' για διόρθωση';
}
document.addEventListener('toggle', paint, true);
$('filter').onchange = e => {
  const f = e.target.value;
  document.querySelectorAll('details.case').forEach(d => {
    const st = d.querySelector('.state').className;
    d.classList.toggle('hidden', f === 'todo' ? /\b(ok)\b/.test(st) : f === 'fix' ? !/\bfix\b/.test(st) : false);
  });
};
$('export').onclick = () => {
  if(!S.reviewer.trim()){ $('reviewer').focus(); alert('Γράψε πρώτα το όνομά σου (ποιος ελέγχει).'); return; }
  const decisions = Object.entries(S.decisions).filter(([k, d]) => keys[k] && d.hash === keys[k].hash).map(([key, d]) => ({key, hash: d.hash, verdict: d.verdict, comment: d.comment || ''}));
  const file = {format: 'ergolav-reviews', version: 1, material: D.material, reviewer: S.reviewer.trim(), exported_at: new Date().toISOString(), decisions};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(file, null, 1)], {type: 'application/json'}));
  a.download = 'ergolav-elegxos-' + D.material + '-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
};
$('approveSc').onclick = () => {
  // Γρήγορα: όσες απλές/σύντομες δεν έχουν απόφαση, στις ανοιχτές περιπτώσεις.
  document.querySelectorAll('details.case[open] .row .decide').forEach(box => { const k = box.dataset.key; if(!verdict(k)) S.decisions[k] = {verdict: 'ok', hash: keys[k].hash, comment: ''}; });
  save();
};
paint();
</script>
