ι στη στάθμη που ρυθμίσαμε.","s":"Το καζανάκι σταματά να γεμίζει εκεί που το ρυθμίσαμε.","c":"Σταματά στη σωστή στάθμη.","source":"current","review":{"key":"sc:plumb-cistern-repair.checks.2","hash":"fe9443bf0b57","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"plumb-cistern-repair.checks.3":{"section":"checks","n":"Μετά από λίγα λεπτά το νερό στη λεκάνη μένει ακίνητο, άρα δεν τρέχει νερό από το καζανάκι.","s":"Περιμένουμε λίγο: το νερό στη λεκάνη δεν κουνιέται, άρα δεν τρέχει από το καζανάκι.","c":"Δεν τρέχει νερό στη λεκάνη.","source":"current","review":{"key":"sc:plumb-cistern-repair.checks.3","hash":"1282bb9dafbe","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"plumb-cistern-repair.handover.1":{"section":"handover","n":"Σκουπίζουμε τα νερά.","s":"Μαζεύουμε τα νερά.","c":"Σκούπισμα νερών.","source":"current","review":{"key":"sc:plumb-cistern-repair.handover.1","hash":"125e00ac58c4","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"plumb-cistern-repair.handover.2":{"section":"handover","n":"Σας εξηγούμε πώς καταλαβαίνετε αν ξαναρχίσει να τρέχει νερό στη λεκάνη.","s":"Σας λέμε πώς θα καταλάβετε αν αρχίσει πάλι να τρέχει νερό στη λεκάνη.","c":"Πώς φαίνεται νέα διαρροή.","source":"current","review":{"key":"sc:plumb-cistern-repair.handover.2","hash":"9e82accef790","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"plumb-cistern-repair.preparation.1":{"section":"preparation","n":"Κλείνουμε το νερό του καζανακιού και το αδειάζουμε.","s":"Κόβουμε το νερό του καζανακιού και το αδειάζουμε τραβώντας το.","c":"Κλείσιμο νερού, άδειασμα.","source":"current","review":{"key":"sc:plumb-cistern-repair.preparation.1","hash":"24996d3316f6","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"plumb-cistern-repair.preparation.2":{"section":"preparation","n":"Ανοίγουμε το καπάκι ή, στο καζανάκι εντοιχισμού, βγάζουμε την πλάκα χειρισμού.","s":"Ανοίγουμε το καπάκι ή, στο καζανάκι του τοίχου, βγάζουμε την πλάκα με τα κουμπιά.","c":"Καπάκι ή πλάκα χειρισμού.","source":"current","review":{"key":"sc:plumb-cistern-repair.preparation.2","hash":"9c842e4e96f2","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"plumb-cistern-repair.preparation.3":{"section":"preparation","n":"Ελέγχουμε αν το νερό διαρρέει από τη βαλβίδα εκκένωσης ή αν το φλοτέρ δεν κόβει το γέμισμα.","s":"Κοιτάμε αν το νερό φεύγει από κάτω, από τη βαλβίδα, ή αν δεν σταματάει να γεμίζει.","c":"Εντοπισμός βλάβης.","source":"current","review":{"key":"sc:plumb-cistern-repair.preparation.3","hash":"1860c78c91e9","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"plumb-cistern-repair.prerequisites.1":{"section":"prerequisites","n":"Να ξέρουμε τον τύπο του καζανακιού (εξωτερικό ή εντοιχισμού), για να φέρουμε συμβατό ανταλλακτικό.","s":"Να ξέρουμε τι καζανάκι είναι, εξωτερικό ή μέσα στον τοίχο, για να φέρουμε κομμάτι που ταιριάζει.","c":"Γνωστός τύπος καζανακιού.","source":"current","review":{"key":"sc:plumb-cistern-repair.prerequisites.1","hash":"79fc4b0fbceb","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"plumb-cistern-repair.prerequisites.2":{"section":"prerequisites","n":"Γωνιακός διακόπτης ή διακόπτης καζανακιού που κλείνει.","s":"Ο μικρός διακόπτης του νερού ή του καζανακιού να κλείνει.","c":"Διακόπτης που κλείνει.","source":"current","review":{"key":"sc:plumb-cistern-repair.prerequisites.2","hash":"6ddbb1bcd52e","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"plumb-cistern-repair.steps.1":{"section":"steps","n":"Αφαιρούμε το φθαρμένο φλοτέρ ή τον μηχανισμό εκκένωσης.","s":"Βγάζουμε το φλοτέρ ή τον μηχανισμό που έχει χαλάσει.","c":"Αφαίρεση φθαρμένου.","source":"current","review":{"key":"sc:plumb-cistern-repair.steps.1","hash":"746f7683dc4d","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"plumb-cistern-repair.steps.2":{"section":"steps","n":"Τοποθετούμε το νέο κομμάτι και το στερεώνουμε στη θέση του.","s":"Βάζουμε το καινούργιο κομμάτι και το στερεώνουμε.","c":"Τοποθέτηση νέου κομματιού.","source":"current","review":{"key":"sc:plumb-cistern-repair.steps.2","hash":"305321abe6d8","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"plumb-cistern-repair.steps.3":{"section":"steps","n":"Ρυθμίζουμε τη στάθμη του νερού και την ποσότητα έκπλυσης, για το μικρό και το μεγάλο κουμπί όπου υπάρχουν.","s":"Ρυθμίζουμε πόσο νερό κρατάει και πόσο ρίχνει, για το μικρό και το μεγάλο κουμπί, όπου υπάρχουν.","c":"Ρύθμιση στάθμης και έκπλυσης.","source":"current","review":{"key":"sc:plumb-cistern-repair.steps.3","hash":"a2850038e9da","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"plumb-cistern-repair.steps.4":{"section":"steps","n":"Ανοίγουμε το νερό και κλείνουμε το καπάκι ή την πλάκα χειρισμού.","s":"Ανοίγουμε το νερό και ξανακλείνουμε το καπάκι ή την πλάκα.","c":"Άνοιγμα νερού, κλείσιμο καπακιού.","source":"current","review":{"key":"sc:plumb-cistern-repair.steps.4","hash":"10be5c14523f","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}}},"licensedNote":"Η εργασία αυτή γίνεται, όπως ορίζει ο νόμος, από αδειούχο ή πιστοποιημένο επαγγελματία.","sections":[{"key":"prerequisites","title":"Τι χρειάζεται πριν ξεκινήσουμε"},{"key":"preparation","title":"Προεργασία"},{"key":"steps","title":"Στάδια τοποθέτησης"},{"key":"checks","title":"Έλεγχοι πριν την παράδοση"},{"key":"handover","title":"Καθαρισμός και παράδοση"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'ergolav-review:' + D.material;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S = {reviewer: '', decisions: {}};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} paint(); };
$('reviewer').value = S.reviewer || '';
$('reviewer').oninput = e => { S.reviewer = e.target.value; save(); };
// Αποφάσεις: μόνο για το κείμενο που φαίνεται (ίδιο αποτύπωμα)· ό,τι άλλαξε από τότε ξαναζητά έλεγχο.
const keys = {};
for(const c of D.cases) if(c.review) keys[c.review.key] = c.review;
for(const [, it] of Object.entries(D.items)) keys[it.review.key] = it.review;
for(const x of D.extras) keys[x.review.key] = x.review;
const verdict = k => { const d = S.decisions[k]; return d && d.hash === keys[k].hash ? d.verdict : (keys[k].reviewed ? 'ok' : null); };
const decideHtml = (k, what) => {
  const d = S.decisions[k] && S.decisions[k].hash === keys[k].hash ? S.decisions[k] : null, v = verdict(k);
  return '<div class="decide" data-key="' + esc(k) + '"><span class="what">' + what + '</span>'
    + '<button type="button" class="ok' + (v === 'ok' ? ' on' : '') + '" data-v="ok" aria-pressed="' + (v === 'ok') + '">Εγκρίνω</button>'
    + '<button type="button" class="fix' + (v === 'fix' ? ' on' : '') + '" data-v="fix" aria-pressed="' + (v === 'fix') + '">Θέλει διόρθωση</button>'
    + '<textarea placeholder="Τι να διορθωθεί;" aria-label="Σχόλιο"' + (v === 'fix' ? '' : ' hidden') + '>' + esc(d && d.comment || '') + '</textarea></div>';
};
const item = (id, withSc) => {
  const it = D.items[id];
  return '<div class="row" data-item="' + esc(id) + '">'
    + '<div class="v"><small>Κανονική <span class="tag ' + (it.source === 'new' ? 'new">νέο' : 'cur">σημερινό') + '</span></small>' + esc(it.n) + '</div>'
    + '<div class="v"><small>Απλή</small>' + esc(it.s) + '</div>'
    + '<div class="v"><small>Σύντομη</small>' + esc(it.c) + '</div>'
    + (withSc ? '<div class="acts">' + decideHtml(it.review.key, 'Απλή και σύντομη:') + '</div>' : '') + '</div>';
};
const body = c => {
  let h = '<p class="meta">Περίπτωση: ' + esc(c.label) + ' · ' + esc(c.duration) + (c.task ? ' · κείμενο: ' + esc(c.task) : '') + '</p>';
  if(c.licensed) h += '<p class="note">' + esc(D.licensedNote) + '</p>';
  if(c.safety) h += '<p class="note">Ασφάλεια: ' + esc(c.safety) + '</p>';
  for(const s of D.sections){ const ids = c.sections[s.key] || []; if(!ids.length) continue;
    h += '<div class="sec"><h3>' + esc(s.title) + '</h3>' + ids.map(id => item(id, true)).join('') + '</div>'; }
  if(c.review) h += decideHtml(c.review.key, c.source === 'existing' ? 'Η περίπτωση (έτοιμο κείμενο):' : 'Η περίπτωση (σύνθεση και νέα κείμενα):');
  return h;
};
const groups = [['base', 'Βασικές περιπτώσεις (σημερινές αναλύσεις)', 'Τα κείμενα δεν αλλάζουν· ελέγχεις μόνο την απλή και τη σύντομη εκδοχή.'],
  ['existing', 'Περιπτώσεις με έτοιμο κείμενο', 'Από τις 96 γραμμένες αναλύσεις.'], ['new', D.material === 'generic' ? 'Κατηγορίες' : 'Νέες περιπτώσεις', '']];
let html = '';
for(const [src, title, sub] of groups){
  const list = D.cases.filter(c => c.source === src); if(!list.length) continue;
  html += '<h2>' + title + ' (' + list.length + ')</h2>' + (sub ? '<p class="small meta">' + sub + '</p>' : '');
  for(const c of list) html += '<details class="case" data-case="' + esc(c.id) + '"><summary><b>' + esc(c.title) + '</b><span class="state" data-state="' + esc(c.id) + '"></span><span class="lbl">' + esc(c.label) + '</span></summary><div class="body"></div></details>';
}
if(D.extras.length){
  html += '<h2>Επιπλέον βήματα για το «Λείπει κάτι» (' + D.extras.length + ')</h2>';
  html += '<div class="case" style="padding:0 14px 14px">' + D.extras.map(x => '<div class="sec"><h3>' + esc((D.sections.find(s => s.key === x.section) || {}).title || x.section)
    + (x.when ? ' · <span class="meta">μόνο όταν ' + esc(Object.entries(x.when).map(([k, v]) => k + ' = ' + v.join(' ή ')).join(', ')) + '</span>' : '') + '</h3>'
    + item(x.id, true) + decideHtml(x.review.key, 'Να μπαίνει ως επιπλέον βήμα:') + '</div>').join('') + '</div>';
}
$('cases').innerHTML = html;
// Το σώμα κάθε περίπτωσης φτιάχνεται όταν ανοίξει (οι σελίδες έχουν εκατοντάδες σημεία).
document.querySelectorAll('details.case').forEach(d => d.addEventListener('toggle', () => {
  const b = d.querySelector('.body'); if(d.open && !b.innerHTML) b.innerHTML = body(D.cases.find(c => c.id === d.dataset.case));
}));
document.addEventListener('click', e => {
  const btn = e.target.closest('.decide button'); if(!btn) return;
  const k = btn.closest('.decide').dataset.key, v = btn.dataset.v, prev = S.decisions[k];
  S.decisions[k] = {verdict: v, hash: keys[k].hash, comment: v === 'fix' ? (prev && prev.comment || '') : ''};
  save();
});
document.addEventListener('input', e => {
  const box = e.target.closest('.decide'); if(!box || e.target.tagName !== 'TEXTAREA') return;
  const k = box.dataset.key; S.decisions[k] = Object.assign({verdict: 'fix', hash: keys[k].hash}, S.decisions[k], {comment: e.target.value});
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
});
function paint(){
  // Ίδιο σημείο σε πολλές περιπτώσεις: η απόφαση φαίνεται παντού.
  document.querySelectorAll('.decide').forEach(box => {
    const v = verdict(box.dataset.key);
    box.querySelectorAll('button').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    box.querySelector('textarea').hidden = v !== 'fix';
  });
  for(const c of D.cases){
    const el = document.querySelector('[data-state="' + CSS.escape(c.id) + '"]'); if(!el) continue;
    const ks = [...(c.review ? [c.review.key] : []), ...Object.values(c.sections).flat().map(id => D.items[id].review.key)];
    const vs = ks.map(verdict), fix = vs.includes('fix'), done = vs.every(v => v === 'ok');
    el.className = 'state ' + (fix ? 'fix' : done ? 'ok' : 'todo');
    el.textContent = fix ? 'θέλει διόρθωση' : done ? 'εγκρίθηκε' : vs.filter(Boolean).length + '/' + vs.length;
  }
  const all = Object.keys(keys), dec = all.filter(k => verdict(k));
  $('progress').textContent = dec.length + ' από ' + all.length + ' αποφάσεις · ' + all.filter(k => verdict(k) === 'fix').length + ' για διόρθωση';
}
document.addEventListener('toggle', paint, true);
$('filter').onchange = e => {
  const f = e.target.value;
  document.querySelectorAll('details.case').forEach(d => {
    const st = d.querySelector('.state').className;
    d.classList.toggle('hidden', f === 'todo' ? /\b(ok)\b/.test(st) : f === 'fix' ? !/\bfix\b/.test(st) : false);
  });
};
$('export').onclick = () => {
  if(!S.reviewer.trim()){ $('reviewer').focus(); alert('Γράψε πρώτα το όνομά σου (ποιος ελέγχει).'); return; }
  const decisions = Object.entries(S.decisions).filter(([k, d]) => keys[k] && d.hash === keys[k].hash).map(([key, d]) => ({key, hash: d.hash, verdict: d.verdict, comment: d.comment || ''}));
  const file = {format: 'ergolav-reviews', version: 1, material: D.material, reviewer: S.reviewer.trim(), exported_at: new Date().toISOString(), decisions};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(file, null, 1)], {type: 'application/json'}));
  a.download = 'ergolav-elegxos-' + D.material + '-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
};
$('approveSc').onclick = () => {
  // Γρήγορα: όσες απλές/σύντομες δεν έχουν απόφαση, στις ανοιχτές περιπτώσεις.
  document.querySelectorAll('details.case[open] .row .decide').forEach(box => { const k = box.dataset.key; if(!verdict(k)) S.decisions[k] = {verdict: 'ok', hash: keys[k].hash, comment: ''}; });
  save();
};
paint();
</script>
</body></html>
