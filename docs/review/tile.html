,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile-wall.steps.5":{"section":"steps","n":"Μετά το στέγνωμα αφαιρούμε τον πήχη, βάζουμε την κάτω σειρά και γεμίζουμε τους αρμούς.","s":"Όταν στεγνώσει, βγάζουμε την πήχη, βάζουμε την κάτω σειρά και γεμίζουμε τα κενά ανάμεσα στα πλακάκια.","c":"Κάτω σειρά και αρμοί μετά το στέγνωμα.","source":"current","review":{"key":"sc:tile-wall.steps.5","hash":"17ee30b3000f","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.handover.heating-start":{"section":"handover","n":"Σας λέμε πότε και με ποια σειρά ανάβει ξανά η θέρμανση, όπως ορίζει ο κατασκευαστής.","s":"Σας λέμε από πότε μπορείτε να ανάψετε τη θέρμανση και πώς να την ανεβάζετε σιγά-σιγά.","c":"Πότε και πώς ανάβει ξανά η θέρμανση.","source":"new","review":{"key":"sc:tile.handover.heating-start","hash":"7a5132d50179","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.preparation.drywall-prime":{"section":"preparation","n":"Περνάμε το αστάρι που ορίζει ο κατασκευαστής της γυψοσανίδας και ταινία στους αρμούς και στις γωνίες.","s":"Περνάμε το υγρό που λένε οι οδηγίες της γυψοσανίδας και κολλάμε ταινία στις ενώσεις και στις γωνίες.","c":"Αστάρι και ταινία σε αρμούς και γωνίες.","source":"new","review":{"key":"sc:tile.preparation.drywall-prime","hash":"45be0e0fb3f2","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.preparation.heated-prime":{"section":"preparation","n":"Καθαρίζουμε την επιφάνεια και βάζουμε το αστάρι που ταιριάζει με το κονίαμα της θέρμανσης.","s":"Καθαρίζουμε το πάτωμα και περνάμε το υγρό που βοηθά την κόλλα να πιάσει πάνω από τη θέρμανση.","c":"Καθαρισμός και κατάλληλο αστάρι.","source":"new","review":{"key":"sc:tile.preparation.heated-prime","hash":"329bfabc9c6b","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.p :54.515Z"}},"tile.prerequisites.heated-ready":{"section":"prerequisites","n":"Η ενδοδαπέδια θέρμανση να έχει δοκιμαστεί και καλυφθεί με το κονίαμά της, και να έχει περάσει ο χρόνος στεγνώματος που ορίζει ο κατασκευαστής.","s":"Οι σωλήνες της θέρμανσης στο πάτωμα πρέπει να έχουν ελεγχθεί και σκεπαστεί, και το τσιμέντο από πάνω να έχει στεγνώσει όσο χρειάζεται.","c":"Θέρμανση δοκιμασμένη, καλυμμένη και στεγνή.","source":"new","review":{"key":"sc:tile.prerequisites.heated-ready","hash":"8f82e00f8b40","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.prerequisites.large-weight":{"section":"prerequisites","n":"Για μεγάλα πλακάκια, ο τοίχος ή ο σκελετός να αντέχει το βάρος τους· το ελέγχουμε πριν ξεκινήσουμε.","s":"Τα μεγάλα πλακάκια είναι βαριά· κοιτάμε πριν ξεκινήσουμε ότι ο τοίχος τα σηκώνει.","c":"Τοίχος που αντέχει μεγάλα πλακάκια.","source":"new","review":{"key":"sc:tile.prerequisites.large-weight","hash":"0f5d121fa40e","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.prerequisites.overtile-solid":{"section":"prerequisites","n":"Τα παλιά πλακάκια να είναι γερά, χωρίς κούφια σημεία, και να επιτρέπει το ύψος την πρόσθετη στρώση (πόρτες, κατωκάσια, είδη υγιεινής).","s":"Τα παλιά πλακάκια πρέπει να είναι σταθερά και να υπάρχει χώρος για το επιπλέον πάχος, ώστε να κλείνουν οι πόρτες.","c":"Παλιά πλακάκια γερά, με περιθώριο στο ύψος.","source":"new","review":{"key":"sc:tile.prerequisites.overtile-solid","hash":"faa39693c887","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.steps.back-butter":{"section":"steps","n":"Στα μεγάλα πλακάκια απλώνουμε κόλλα και στην πλάτη τους, για να μη μείνουν κενά από κάτω.","s":"Στα μεγάλα πλακάκια βάζουμε κόλλα και από πίσω, για να κολλήσουν παντού χωρίς κενά.","c":"Κόλλα και στην πλάτη των μεγάλων.","source":"new","review":{"key":"sc:tile.steps.back-butter","hash":"04cc6a8d0801","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.steps.flex-glue":{"section":"steps","n":"Απλώνουμε εύκαμπτη κόλλα, κατάλληλη για θερμαινόμενα δάπεδα, με οδοντωτή σπάτουλα.","s":"Απλώνουμε κόλλα που αντέχει τη ζέστη και τις μικρές κινήσεις του πατώματος.","c":"Εύκαμπτη κόλλα για θερμαινόμενο δάπεδο.","source":"new","review":{"key":"sc:tile.steps.flex-glue","hash":"8abf36071c35","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.steps.leveling-system":{"section":"steps","n":"Χρησιμοποιούμε σύστημα αλφαδιάσματος, για να μένουν τα μεγάλα πλακάκια στο ίδιο επίπεδο μεταξύ τους.","s":"Βάζουμε ειδικά κλιπ που κρατούν τα μεγάλα πλακάκια ίσια το ένα με το άλλο.","c":"Σύστημα αλφαδιάσματος για ίδιο επίπεδο.","source":"new","review":{"key":"sc:tile.steps.leveling-system","hash":"dabcb12a1083","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.steps.mosaic-flex":{"section":"steps","n":"Απλώνουμε εύκαμπτη κόλλα, κατάλληλη για ψηφίδα και για θερμαινόμενο δάπεδο, με λεπτή οδοντωτή σπάτουλα.","s":"Απλώνουμε λεπτή στρώση κόλλας που ταιριάζει στην ψηφίδα και αντέχει τη ζέστη του πατώματος.","c":"Εύκαμπτη κόλλα για ψηφίδα σε θερμαινόμενο.","source":"new","review":{"key":"sc:tile.steps.mosaic-flex","hash":"b0a597b14909","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.steps.movement-joints":{"section":"steps","n":"Αφήνουμε αρμούς διαστολής στα σημεία που ορίζει ο σχεδιασμός της θέρμανσης.","s":"Αφήνουμε μικρά κενά εκεί που χρειάζεται, γιατί το πάτωμα «ανασαίνει» όταν ζεσταίνεται.","c":"Αρμοί διαστολής όπου ορίζει η θέρμανση.","source":"new","review":{"key":"sc:tile.steps.movement-joints","hash":"27f777205269","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.x.grout-seal":{"section":"handover","n":"Περνάμε προστατευτικό στους αρμούς, όπου το έχουμε συμφωνήσει.","s":"Περνάμε ένα υγρό στις γραμμές ανάμεσα στα πλακάκια, για να μη λερώνονται εύκολα, αν το έχουμε συμφωνήσει.","c":"Προστατευτικό αρμών, αν συμφωνήθηκε.","source":"new","review":{"key":"sc:tile.x.grout-seal","hash":"8b342812847a","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.x.protect":{"section":"preparation","n":"Προστατεύουμε είδη υγιεινής, κουφώματα και δάπεδα γύρω από τον χώρο εργασίας.","s":"Σκεπάζουμε τα είδη του μπάνιου, τις πόρτες και τα πατώματα γύρω από εκεί που δουλεύουμε.","c":"Προστασία γύρω από τον χώρο.","source":"new","review":{"key":"sc:tile.x.protect","hash":"8bad6c5d3694","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.x.skirting":{"section":"steps","n":"Τοποθετούμε σοβατεπί από το ίδιο πλακάκι στη βάση των τοίχων.","s":"Βάζουμε λωρίδες από το ίδιο πλακάκι στο κάτω μέρος των τοίχων.","c":"Σοβατεπί από το ίδιο πλακάκι.","source":"new","review":{"key":"sc:tile.x.skirting","hash":"48977aa7fb9d","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}},"tile.x.threshold":{"section":"steps","n":"Βάζουμε προφίλ ή κατωκάσι εκεί όπου το νέο δάπεδο συναντά άλλο δάπεδο στις πόρτες.","s":"Στις πόρτες, όπου αλλάζει το πάτωμα, βάζουμε ένα μεταλλικό ή μαρμάρινο τελείωμα.","c":"Προφίλ ή κατωκάσι στις πόρτες.","source":"new","review":{"key":"sc:tile.x.threshold","hash":"31d5200b947d","reviewed":true,"reviewer":"Φίλιππος (μαζική έγκριση)","reviewed_at":"2026-11-18T09:46:54.515Z"}}},"licensedNote":"Η εργασία αυτή γίνεται, όπως ορίζει ο νόμος, από αδειούχο ή πιστοποιημένο επαγγελματία.","sections":[{"key":"prerequisites","title":"Τι χρειάζεται πριν ξεκινήσουμε"},{"key":"preparation","title":"Προεργασία"},{"key":"steps","title":"Στάδια τοποθέτησης"},{"key":"checks","title":"Έλεγχοι πριν την παράδοση"},{"key":"handover","title":"Καθαρισμός και παράδοση"}]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const KEY = 'ergolav-review:' + D.material;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S = {reviewer: '', decisions: {}};
try { S = Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} paint(); };
$('reviewer').value = S.reviewer || '';
$('reviewer').oninput = e => { S.reviewer = e.target.value; save(); };
// Αποφάσεις: μόνο για το κείμενο που φαίνεται (ίδιο αποτύπωμα)· ό,τι άλλαξε από τότε ξαναζητά έλεγχο.
const keys = {};
for(const c of D.cases) if(c.review) keys[c.review.key] = c.review;
for(const [, it] of Object.entries(D.items)) keys[it.review.key] = it.review;
for(const x of D.extras) keys[x.review.key] = x.review;
const verdict = k => { const d = S.decisions[k]; return d && d.hash === keys[k].hash ? d.verdict : (keys[k].reviewed ? 'ok' : null); };
const decideHtml = (k, what) => {
  const d = S.decisions[k] && S.decisions[k].hash === keys[k].hash ? S.decisions[k] : null, v = verdict(k);
  return '<div class="decide" data-key="' + esc(k) + '"><span class="what">' + what + '</span>'
    + '<button type="button" class="ok' + (v === 'ok' ? ' on' : '') + '" data-v="ok" aria-pressed="' + (v === 'ok') + '">Εγκρίνω</button>'
    + '<button type="button" class="fix' + (v === 'fix' ? ' on' : '') + '" data-v="fix" aria-pressed="' + (v === 'fix') + '">Θέλει διόρθωση</button>'
    + '<textarea placeholder="Τι να διορθωθεί;" aria-label="Σχόλιο"' + (v === 'fix' ? '' : ' hidden') + '>' + esc(d && d.comment || '') + '</textarea></div>';
};
const item = (id, withSc) => {
  const it = D.items[id];
  return '<div class="row" data-item="' + esc(id) + '">'
    + '<div class="v"><small>Κανονική <span class="tag ' + (it.source === 'new' ? 'new">νέο' : 'cur">σημερινό') + '</span></small>' + esc(it.n) + '</div>'
    + '<div class="v"><small>Απλή</small>' + esc(it.s) + '</div>'
    + '<div class="v"><small>Σύντομη</small>' + esc(it.c) + '</div>'
    + (withSc ? '<div class="acts">' + decideHtml(it.review.key, 'Απλή και σύντομη:') + '</div>' : '') + '</div>';
};
const body = c => {
  let h = '<p class="meta">Περίπτωση: ' + esc(c.label) + ' · ' + esc(c.duration) + (c.task ? ' · κείμενο: ' + esc(c.task) : '') + '</p>';
  if(c.licensed) h += '<p class="note">' + esc(D.licensedNote) + '</p>';
  if(c.safety) h += '<p class="note">Ασφάλεια: ' + esc(c.safety) + '</p>';
  for(const s of D.sections){ const ids = c.sections[s.key] || []; if(!ids.length) continue;
    h += '<div class="sec"><h3>' + esc(s.title) + '</h3>' + ids.map(id => item(id, true)).join('') + '</div>'; }
  if(c.review) h += decideHtml(c.review.key, c.source === 'existing' ? 'Η περίπτωση (έτοιμο κείμενο):' : 'Η περίπτωση (σύνθεση και νέα κείμενα):');
  return h;
};
const groups = [['base', 'Βασικές περιπτώσεις (σημερινές αναλύσεις)', 'Τα κείμενα δεν αλλάζουν· ελέγχεις μόνο την απλή και τη σύντομη εκδοχή.'],
  ['existing', 'Περιπτώσεις με έτοιμο κείμενο', 'Από τις 96 γραμμένες αναλύσεις.'], ['new', D.material === 'generic' ? 'Κατηγορίες' : 'Νέες περιπτώσεις', '']];
let html = '';
for(const [src, title, sub] of groups){
  const list = D.cases.filter(c => c.source === src); if(!list.length) continue;
  html += '<h2>' + title + ' (' + list.length + ')</h2>' + (sub ? '<p class="small meta">' + sub + '</p>' : '');
  for(const c of list) html += '<details class="case" data-case="' + esc(c.id) + '"><summary><b>' + esc(c.title) + '</b><span class="state" data-state="' + esc(c.id) + '"></span><span class="lbl">' + esc(c.label) + '</span></summary><div class="body"></div></details>';
}
if(D.extras.length){
  html += '<h2>Επιπλέον βήματα για το «Λείπει κάτι» (' + D.extras.length + ')</h2>';
  html += '<div class="case" style="padding:0 14px 14px">' + D.extras.map(x => '<div class="sec"><h3>' + esc((D.sections.find(s => s.key === x.section) || {}).title || x.section)
    + (x.when ? ' · <span class="meta">μόνο όταν ' + esc(Object.entries(x.when).map(([k, v]) => k + ' = ' + v.join(' ή ')).join(', ')) + '</span>' : '') + '</h3>'
    + item(x.id, true) + decideHtml(x.review.key, 'Να μπαίνει ως επιπλέον βήμα:') + '</div>').join('') + '</div>';
}
$('cases').innerHTML = html;
// Το σώμα κάθε περίπτωσης φτιάχνεται όταν ανοίξει (οι σελίδες έχουν εκατοντάδες σημεία).
document.querySelectorAll('details.case').forEach(d => d.addEventListener('toggle', () => {
  const b = d.querySelector('.body'); if(d.open && !b.innerHTML) b.innerHTML = body(D.cases.find(c => c.id === d.dataset.case));
}));
document.addEventListener('click', e => {
  const btn = e.target.closest('.decide button'); if(!btn) return;
  const k = btn.closest('.decide').dataset.key, v = btn.dataset.v, prev = S.decisions[k];
  S.decisions[k] = {verdict: v, hash: keys[k].hash, comment: v === 'fix' ? (prev && prev.comment || '') : ''};
  save();
});
document.addEventListener('input', e => {
  const box = e.target.closest('.decide'); if(!box || e.target.tagName !== 'TEXTAREA') return;
  const k = box.dataset.key; S.decisions[k] = Object.assign({verdict: 'fix', hash: keys[k].hash}, S.decisions[k], {comment: e.target.value});
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
});
function paint(){
  // Ίδιο σημείο σε πολλές περιπτώσεις: η απόφαση φαίνεται παντού.
  document.querySelectorAll('.decide').forEach(box => {
    const v = verdict(box.dataset.key);
    box.querySelectorAll('button').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
    box.querySelector('textarea').hidden = v !== 'fix';
  });
  for(const c of D.cases){
    const el = document.querySelector('[data-state="' + CSS.escape(c.id) + '"]'); if(!el) continue;
    const ks = [...(c.review ? [c.review.key] : []), ...Object.values(c.sections).flat().map(id => D.items[id].review.key)];
    const vs = ks.map(verdict), fix = vs.includes('fix'), done = vs.every(v => v === 'ok');
    el.className = 'state ' + (fix ? 'fix' : done ? 'ok' : 'todo');
    el.textContent = fix ? 'θέλει διόρθωση' : done ? 'εγκρίθηκε' : vs.filter(Boolean).length + '/' + vs.length;
  }
  const all = Object.keys(keys), dec = all.filter(k => verdict(k));
  $('progress').textContent = dec.length + ' από ' + all.length + ' αποφάσεις · ' + all.filter(k => verdict(k) === 'fix').length + ' για διόρθωση';
}
document.addEventListener('toggle', paint, true);
$('filter').onchange = e => {
  const f = e.target.value;
  document.querySelectorAll('details.case').forEach(d => {
    const st = d.querySelector('.state').className;
    d.classList.toggle('hidden', f === 'todo' ? /\b(ok)\b/.test(st) : f === 'fix' ? !/\bfix\b/.test(st) : false);
  });
};
$('export').onclick = () => {
  if(!S.reviewer.trim()){ $('reviewer').focus(); alert('Γράψε πρώτα το όνομά σου (ποιος ελέγχει).'); return; }
  const decisions = Object.entries(S.decisions).filter(([k, d]) => keys[k] && d.hash === keys[k].hash).map(([key, d]) => ({key, hash: d.hash, verdict: d.verdict, comment: d.comment || ''}));
  const file = {format: 'ergolav-reviews', version: 1, material: D.material, reviewer: S.reviewer.trim(), exported_at: new Date().toISOString(), decisions};
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(file, null, 1)], {type: 'application/json'}));
  a.download = 'ergolav-elegxos-' + D.material + '-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
};
$('approveSc').onclick = () => {
  // Γρήγορα: όσες απλές/σύντομες δεν έχουν απόφαση, στις ανοιχτές περιπτώσεις.
  document.querySelectorAll('details.case[open] .row .decide').forEach(box => { const k = box.dataset.key; if(!verdict(k)) S.decisions[k] = {verdict: 'ok', hash: keys[k].hash, comment: ''}; });
  save();
};
paint();
</script>
</body></html>
